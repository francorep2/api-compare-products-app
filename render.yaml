# Beta: API en Render (plan free) + base Postgres en Supabase (plan free).
# La base NO vive en Render (su Postgres free expira a los 30 días).
#
# Crear: Render > New > Blueprint > este repo (rama main). Render pide DATABASE_URL:
# pegar la cadena del "Session pooler" de Supabase (Project > Connect), región us-east-1.
# El web free se duerme a los 15 min sin uso (la primera consulta tarda ~1 min en despertar).
previews:
  generation: off

services:
  - type: web
    name: groceries-api
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase > Connect > Session pooler (postgresql://postgres.<ref>:<clave>@aws-0-us-east-1.pooler.supabase.com:5432/postgres)
      - key: JWT_SECRET
        generateValue: true  # Render genera un secreto aleatorio
      - key: APP_NAME
        value: "Changuito Beta"

      # Mails: con Resend. Sin RESEND_API_KEY los códigos OTP salen por los logs.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false  # p. ej. Changuito <no-reply@tu-dominio-verificado>
      - key: SMTP_DRY_RUN
        value: "1"  # poner 0 al cargar RESEND_API_KEY
      - key: USE_SENDGRID_API
        value: "0"
