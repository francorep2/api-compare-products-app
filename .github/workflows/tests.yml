name: tests
on:
  pull_request:
  push:
    branches: [main, dev-barcode]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - name: Las migraciones aplican sobre una base vacía
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///ci.db
          JWT_SECRET: ci-secret-no-usar-en-prod
