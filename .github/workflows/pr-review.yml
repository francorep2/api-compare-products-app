name: Pir

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: ['main']
  issue_comment:
    types: [created]

concurrency:
  group: pir-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: francorep2/pr-reviewer/.github/workflows/review.yml@main
    secrets: inherit

  conflicts:
    if: github.event_name == 'pull_request_target' || github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: francorep2/pr-reviewer/.github/workflows/conflicts.yml@main
    secrets: inherit

  resolve:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/pir resolver') &&
      github.event.comment.user.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: francorep2/pr-reviewer/.github/workflows/resolve.yml@main
    secrets: inherit
