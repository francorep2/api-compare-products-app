services:
  postgres:
    image: postgres:15
    container_name: groceries_pg
    environment:
      POSTGRES_DB: groceries
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: super-secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d groceries"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
